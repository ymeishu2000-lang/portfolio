  <script src="script.js"></script>
  <script>
    // header.html を読み込んで、挿入後にヘッダー用のイベントをセットアップする
    const headerContainer = document.getElementById('headerContainer');
    const headerPath = headerContainer.dataset.headerPath || 'header.html';

    fetch(headerPath)
      .then(response => response.text())
      .then(html => {
        headerContainer.innerHTML = html;
        initHeader();
      })
      .catch(error => {
        console.error('headerの読み込みに失敗しました', error);
      });

    function initHeader() {
      const header = document.getElementById('siteHeader');
      const menuBtn = document.getElementById('menuBtn');
      const navOverlay = document.getElementById('navOverlay');

      // heroセクションから外れたらheaderを表示する
      // （scrollYの数値決め打ちだと、hero部分の高さを変えるたびに調整が必要になるため、
      // 　heroセクション自体の可視状態をIntersectionObserverで監視する）
      const hero = document.getElementById('hero');
      if (hero) {
        const heroObserver = new IntersectionObserver(([entry]) => {
          header.classList.toggle('visible', !entry.isIntersecting);
        }, { threshold: 0 });
        heroObserver.observe(hero);
      }

      // ハンバーガーメニューのトグル
      // ・menuBtnに.openが付くとアイコンがばつ印に変形（CSS側で対応）
      // ・navOverlayに.openが付くと上から下へスライドして表示
      // ・headerに.openが付くと背景色と文字色が反転
      menuBtn.addEventListener('click', () => {
        const isOpen = navOverlay.classList.toggle('open');
        menuBtn.classList.toggle('open', isOpen);
        header.classList.toggle('open', isOpen);
        menuBtn.setAttribute('aria-expanded', isOpen);
      });

      navOverlay.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          navOverlay.classList.remove('open');
          menuBtn.classList.remove('open');
          header.classList.remove('open');
          menuBtn.setAttribute('aria-expanded', 'false');
        });
      });
    }
  </script>
